# Slow-channel maintenance, daily at 09:15 UTC (~4–5am ET, before the US
# morning):
#
# - openFDA enforcement reconciliation. The source updates WEEKLY, so the job
#   first reads the one-request bulk-export manifest and runs the full
#   download + reconcile only when the export date moved — most days this is
#   seconds. (docs/recall-source-contract.md §3.2/§9: daily checks catch the
#   weekly refresh promptly at trivial cost.)
# - FSIS label full sweep: every missing label PDF, failure retries with
#   backoff, and the bounded recent-window byte re-verification. Already-
#   rendered PDFs are not re-fetched.
#
# Same secrets and overlap layering as scheduled-ingest.yml.

# ── Supply-chain and secret hardening (P2B7S) ────────────────────────────────
#
# 1. SUPABASE_SECRET_KEY is set PER STEP, never at job level. It is the
#    service-role key: it bypasses RLS entirely and can read and write every
#    production table. At job scope it was also in the environment of
#    `npm ci`, so a malicious `postinstall` anywhere in the dependency tree
#    could have exfiltrated full production access without touching this
#    repository. Checkout, setup-node and npm ci now run with no production
#    secret in scope at all; only the steps that talk to Supabase get it.
#
# 2. Third-party actions are pinned to a full commit SHA with the release in
#    a trailing comment. A tag is a mutable pointer the action's owner can
#    move; a SHA is not. Both actions are GitHub-owned and the pinned commits
#    are byte-identical to what the `v7` tags resolved to on 2026-09-19, so
#    this changes nothing about what runs today. To update: read the action's
#    release notes, resolve the new tag to its commit
#    (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`), replace both the
#    SHA and the version comment, and name the release in the commit message.
#
# 3. The secret-consuming job runs in the `production` GitHub Environment,
#    and the production secrets live ONLY in that environment — never at
#    repository scope. The environment allows deployments from `master`
#    alone, and GitHub evaluates that against the run's github ref BEFORE
#    the job starts: a `workflow_dispatch` on any other ref fails the job
#    and stops the run, with no secret ever placed in its environment.
#
#    That is the actual security boundary, and it survives a hostile branch
#    editing THIS FILE, which a YAML ref check does not. A branch that drops
#    `environment: production` gets a job with no production secrets in it;
#    a branch that renames it to something else gets an empty auto-created
#    environment, which also has no secrets. There is no edit to this file
#    that hands a non-master ref the service-role key.
#
#    The `Assert production ref` step below is a tripwire for
#    misconfiguration — it is NOT the security boundary, because branch code
#    could delete it.
#
# All three rules are enforced by src/server/jobs/workflow-schedule.test.ts,
# so a later edit cannot quietly widen the secret scope, float a tag again,
# or take the secret-consuming job out of the production environment.

name: daily-maintenance

on:
  schedule:
    - cron: '15 9 * * *' # UTC
  workflow_dispatch: {}

concurrency:
  group: daily-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    # The real security boundary (hardening note 3): production secrets live
    # only in this environment, and this environment allows only `master`.
    environment: production
    # No job-level `env:` on purpose — see hardening note 1 above.
    steps:
      # Tripwire, NOT the security boundary — see hardening note 3. Branch
      # code could delete this step; what it cannot delete is the
      # environment's deployment-branch restriction. This exists to fail
      # fast and legibly if the `production` environment ever loses that
      # restriction, and it runs FIRST so a disallowed ref stops before any
      # repository code is checked out or executed.
      #
      # The ref reaches the shell only through `env:`. A branch name is
      # attacker-chosen text, and inlining a context straight into a `run:`
      # body is the documented script-injection vector.
      - name: Assert production ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$WORKFLOW_REF"
          if [ "$WORKFLOW_REF" != "refs/heads/master" ]; then
            echo "::error::Refusing to run production ingestion from $WORKFLOW_REF"
            exit 1
          fi
      # SHA-pinned v7 majors — same rationale, verification and update
      # procedure as scheduled-ingest.yml. These steps receive NO production
      # secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Receives NO secret: this is the step that runs third-party
      # lifecycle scripts.
      - run: npm ci
      - name: FDA enforcement (weekly-gated)
        run: npm run jobs:enforcement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: FSIS label visuals (full sweep)
        if: ${{ !cancelled() }}
        run: npm run jobs:labels -- --full
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Enforcement reconciliation can create classification NotificationEvents;
      # delivering here means risk updates go out in the same daily cycle
      # instead of waiting for the next 30-minute tick.
      - name: Push delivery + receipts
        if: ${{ !cancelled() }}
        run: npm run jobs:push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
