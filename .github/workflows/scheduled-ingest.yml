# Fast-channel ingestion: FDA announcements + FSIS recalls/PHAs twice an hour
# at :07 and :37 (UTC), plus the recent-window FSIS label sync. Steady state
# each tick is ~1 minute: one listing/API fetch per source, and the unchanged-
# source gate skips per-record processing when the feed content is identical.
#
# Cadence follows docs/recall-source-contract.md §9: both fast channels are
# one cheap request, fresh to the current/previous day, and far below any
# verified rate limit. Agency polling runs around the clock — quiet hours are
# a notification-delivery concern (Phase C2), never an ingestion one.
#
# Overlap safety is layered: this concurrency group queues runs at the
# scheduler, and every job additionally takes a Postgres lease (job_leases),
# which also covers manual runs from a laptop. A failed step does not stop
# later steps; any failure marks the workflow failed (GitHub emails on
# scheduled-workflow failure).
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SECRET_KEY   — server-only; never in the app bundle.
#
# NOTE: GitHub disables cron workflows after 60 days without repo activity.
#
# The schedule below is BEST-EFFORT ONLY. Measured delivery on this
# repository: 16 of 67 expected ticks (24%) under `*/30` (2026-08-26/27), and
# at most 4 of 44 (9%) under the `:07`/`:37` offset (2026-08-27/28) — the
# offset did not fix it. Schedule events are dropped, not queued, so a missed
# tick is simply lost. The Supabase scheduler watchdog
# (supabase/functions/ingest-watchdog + docs/recall-scheduler-watchdog.md)
# is designed to own freshness by calling workflow_dispatch on this workflow
# whenever FDA/FSIS ingestion goes stale — but that holds only once it is
# deployed and activated, and its live activation state must be verified
# against production (npm run scheduler:status / ops:health), never assumed
# from the code. Until that activation is confirmed, this cron remains the
# delivery path, at the measured best-effort rates above. Keep the cron as a
# free extra chance at a tick either way, and never remove
# workflow_dispatch (it is the watchdog's target and the manual recovery
# path).

# ── Supply-chain and secret hardening (P2B7S) ────────────────────────────────
#
# 1. SUPABASE_SECRET_KEY is set PER STEP, never at job level. It is the
#    service-role key: it bypasses RLS entirely and can read and write every
#    production table. At job scope it was also in the environment of
#    `npm ci`, so a malicious `postinstall` anywhere in the dependency tree
#    could have exfiltrated full production access without touching this
#    repository. Checkout, setup-node and npm ci now run with no production
#    secret in scope at all; only the steps that talk to Supabase get it.
#
# 2. Third-party actions are pinned to a full commit SHA with the release in
#    a trailing comment. A tag is a mutable pointer the action's owner can
#    move; a SHA is not. Both actions are GitHub-owned and the pinned commits
#    are byte-identical to what the `v7` tags resolved to on 2026-09-19, so
#    this changes nothing about what runs today. To update: read the action's
#    release notes, resolve the new tag to its commit
#    (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`), replace both the
#    SHA and the version comment, and name the release in the commit message.
#
# 3. The secret-consuming job runs in the `production` GitHub Environment,
#    and the production secrets live ONLY in that environment — never at
#    repository scope. The environment allows deployments from `master`
#    alone, and GitHub evaluates that against the run's github ref BEFORE
#    the job starts: a `workflow_dispatch` on any other ref fails the job
#    and stops the run, with no secret ever placed in its environment.
#
#    That is the actual security boundary, and it survives a hostile branch
#    editing THIS FILE, which a YAML ref check does not. A branch that drops
#    `environment: production` gets a job with no production secrets in it;
#    a branch that renames it to something else gets an empty auto-created
#    environment, which also has no secrets. There is no edit to this file
#    that hands a non-master ref the service-role key.
#
#    The `Assert production ref` step below is a tripwire for
#    misconfiguration — it is NOT the security boundary, because branch code
#    could delete it.
#
# All three rules are enforced by src/server/jobs/workflow-schedule.test.ts,
# so a later edit cannot quietly widen the secret scope, float a tag again,
# or take the secret-consuming job out of the production environment.

name: scheduled-ingest

on:
  schedule:
    - cron: '7,37 * * * *' # UTC — offset off :00/:30 on purpose (see above)
  workflow_dispatch: {}

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The real security boundary (hardening note 3): production secrets live
    # only in this environment, and this environment allows only `master`.
    environment: production
    # No job-level `env:` on purpose. Every production secret is declared on
    # the individual step that needs it (hardening note 1 above).
    steps:
      # Tripwire, NOT the security boundary — see hardening note 3. Branch
      # code could delete this step; what it cannot delete is the
      # environment's deployment-branch restriction. This exists to fail
      # fast and legibly if the `production` environment ever loses that
      # restriction, and it runs FIRST so a disallowed ref stops before any
      # repository code is checked out or executed.
      #
      # The ref reaches the shell only through `env:`. A branch name is
      # attacker-chosen text, and inlining a context straight into a `run:`
      # body is the documented script-injection vector.
      - name: Assert production ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$WORKFLOW_REF"
          if [ "$WORKFLOW_REF" != "refs/heads/master" ]; then
            echo "::error::Refusing to run production ingestion from $WORKFLOW_REF"
            exit 1
          fi
      # SHA-pinned v7 majors (see the hardening note above). v7 is the
      # current stable major for both and runs the node24 action runtime;
      # v4 ran the deprecated node20 one. Verified against the actions'
      # official READMEs 2026-08-28: no input we use changed behaviour, and
      # the v7 fork-PR safety default cannot apply (no pull_request_target
      # here). These steps receive NO production secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Installs the dependency tree. Deliberately receives NO secret: this
      # is the step that executes third-party lifecycle scripts.
      - run: npm ci
      - name: FDA announcements
        run: npm run jobs:fda
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: FSIS recalls/PHAs
        if: ${{ !cancelled() }}
        run: npm run jobs:fsis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: FSIS label visuals (recent)
        if: ${{ !cancelled() }}
        run: npm run jobs:labels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Push delivery runs after ingestion so events created THIS tick are
      # delivered in the same cycle; receipts from the previous tick (30 min
      # ago) satisfy Expo's check-after-15-minutes guidance. Until the founder
      # runs push:activate this step is a no-send no-op.
      - name: Push delivery + receipts
        if: ${{ !cancelled() }}
        run: npm run jobs:push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Dead-man heartbeat (P2B7S). LAST on purpose, and it is the only step
      # that sees the heartbeat secrets. It re-reads freshness from the
      # database and pings the external monitor ONLY when both required
      # agency channels satisfy the SLO, so a run that completed without
      # actually ingesting cannot report itself healthy. It never fails the
      # workflow and never writes: a withheld ping IS the alarm.
      #
      # Until the founder creates HEARTBEAT_URL the step prints that
      # monitoring is NOT configured and exits 0. Nothing in the app or this
      # file claims external monitoring is active before then.
      - name: Ingestion freshness heartbeat
        if: ${{ !cancelled() }}
        run: npm run ops:heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          HEARTBEAT_FDA_URL: ${{ secrets.HEARTBEAT_FDA_URL }}
          HEARTBEAT_FSIS_URL: ${{ secrets.HEARTBEAT_FSIS_URL }}
